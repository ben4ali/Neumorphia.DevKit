<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#f2f4f8" />
      <stop offset="100%" stop-color="#d9dee7" />
    </radialGradient>

    <!-- 135-deg Raised Neumorphic Shadow Filter -->
    <filter id="raisedCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#a8b5c8" flood-opacity="0.5" />
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>

    <!-- Subtle Inset Shadow Filter -->
    <filter id="insetPill" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#b0bccd" flood-opacity="0.4" />
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2b2e42" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Main Extruded Neumorphic Card -->
  <rect x="80" y="70" width="1040" height="490" rx="24" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#d1d9e6" stroke-width="1" />

  <!-- Brand Mark + Logo -->
  <g transform="translate(140, 130)">
    <!-- Logo Surface Base -->
    <rect x="0" y="0" width="68" height="68" rx="18" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1" />
    
    <!-- Official Logo Geometry -->
    <g transform="translate(9, 9) scale(0.098)" fill="#2b2e42">
      <rect x="184" y="184" width="144" height="144" rx="52" fill="#3d5a80" />
      <path d="M 124 256 A 132 132 0 0 1 256 124 C 269.25 124, 280 113.25, 280 100 C 280 86.75, 269.25 76, 256 76 A 180 180 0 0 0 76 256 C 76 269.25, 86.75 280, 100 280 C 113.25 280, 124 269.25, 124 256 Z" fill="#2b2e42" />
      <path d="M 388 256 A 132 132 0 0 1 256 388 C 242.75 388, 232 398.75, 232 412 C 232 425.25, 242.75 436, 256 436 A 180 180 0 0 0 436 256 C 436 242.75, 425.25 232, 412 232 C 398.75 232, 388 242.75, 388 256 Z" fill="#2b2e42" />
    </g>

    <!-- Brand Header -->
    <text x="86" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#2b2e42" letter-spacing="-0.5">
      Neumorphia<tspan fill="#3d5a80">.DevKit</tspan>
    </text>
    <text x="86" y="58" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">
      SOFT UI COMPONENT LIBRARY
    </text>
  </g>

  <!-- Headline -->
  <text x="140" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#2b2e42" letter-spacing="-1">
    Neumorphic UI Components
  </text>
  <text x="140" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#3d5a80" letter-spacing="-0.5">
    for React and Tailwind CSS
  </text>

  <!-- Subtitle Paragraph -->
  <text x="140" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#475569">
    A collection of 28+ clean, tactile components for modern web apps.
  </text>
  <text x="140" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#475569">
    Fully responsive with light and dark mode, copy-paste code, and CLI installer.
  </text>

  <!-- Simple Technical Tags (Normal, straightforward, no emojis) -->
  <g transform="translate(140, 465)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="160" height="38" rx="8" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="80" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#2b2e42" text-anchor="middle">
      28+ Components
    </text>

    <!-- Tag 2 -->
    <rect x="175" y="0" width="175" height="38" rx="8" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="262" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">
      React &amp; Tailwind
    </text>

    <!-- Tag 3 -->
    <rect x="365" y="0" width="170" height="38" rx="8" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="450" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#2d6a4f" text-anchor="middle">
      Dark &amp; Light Mode
    </text>

    <!-- Tag 4 -->
    <rect x="550" y="0" width="175" height="38" rx="8" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="637" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
      CLI &amp; Copy-Paste
    </text>

    <!-- Tag 5 -->
    <rect x="740" y="0" width="180" height="38" rx="8" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="830" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">
      By Ali Benkarrouch
    </text>
  </g>
</svg>
