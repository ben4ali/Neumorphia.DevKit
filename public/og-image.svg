<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#f2f4f8" />
      <stop offset="100%" stop-color="#d9dee7" />
    </radialGradient>

    <!-- 135-deg Raised Neumorphic Shadow Filter -->
    <filter id="raisedCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="14" dy="14" stdDeviation="18" flood-color="#a8b5c8" flood-opacity="0.55" />
      <feDropShadow dx="-14" dy="-14" stdDeviation="18" flood-color="#ffffff" flood-opacity="0.95" />
    </filter>

    <!-- Subtle Inset Shadow Filter -->
    <filter id="insetPill" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#b0bccd" flood-opacity="0.4" />
      <feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Architectural Grid Pattern -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2b2e42" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Main Extruded Neumorphic Card -->
  <rect x="70" y="60" width="1060" height="510" rx="28" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#d1d9e6" stroke-width="1.2" />

  <!-- Official Brand Mark + Logo -->
  <g transform="translate(130, 115)">
    <!-- Logo Surface Base -->
    <rect x="0" y="0" width="76" height="76" rx="20" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1" />
    
    <!-- Official Logo Geometry (Scaled from Logo.tsx) -->
    <g transform="translate(10, 10) scale(0.109)" fill="#2b2e42">
      <!-- Central Tactile Squircle -->
      <rect x="184" y="184" width="144" height="144" rx="52" fill="#3d5a80" />
      
      <!-- Top-Left Highlight Arc -->
      <path d="M 124 256 A 132 132 0 0 1 256 124 C 269.25 124, 280 113.25, 280 100 C 280 86.75, 269.25 76, 256 76 A 180 180 0 0 0 76 256 C 76 269.25, 86.75 280, 100 280 C 113.25 280, 124 269.25, 124 256 Z" fill="#2b2e42" />
      
      <!-- Bottom-Right Shadow Arc -->
      <path d="M 388 256 A 132 132 0 0 1 256 388 C 242.75 388, 232 398.75, 232 412 C 232 425.25, 242.75 436, 256 436 A 180 180 0 0 0 436 256 C 436 242.75, 425.25 232, 412 232 C 398.75 232, 388 242.75, 388 256 Z" fill="#2b2e42" />
    </g>

    <!-- Brand Header -->
    <text x="96" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#2b2e42" letter-spacing="-0.8">
      Neumorphia<tspan fill="#3d5a80">.DevKit</tspan>
    </text>
    <text x="96" y="68" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#64748b" letter-spacing="1.5">
      TACTILE DESIGN SYSTEM &amp; COMPONENT REGISTRY
    </text>
  </g>

  <!-- Headline -->
  <text x="130" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#2b2e42" letter-spacing="-1.2">
    Engineering Tactile Neumorphism
  </text>
  <text x="130" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#3d5a80" letter-spacing="-0.5">
    for React, Tailwind CSS, and Modern Web Applications
  </text>

  <!-- Subtitle Paragraph -->
  <text x="130" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#475569">
    A comprehensive library of 28+ accessible, production-ready components featuring 135° dual-shadow
  </text>
  <text x="130" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500" fill="#475569">
    directional lighting physics, full dark mode integration, interactive sandbox, and CLI installer.
  </text>

  <!-- Technical Metric Badges (Zero Emojis, Clean Muted Architecture) -->
  <g transform="translate(130, 465)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="165" height="38" rx="10" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="82" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#2b2e42" text-anchor="middle">
      28+ Components
    </text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="185" height="38" rx="10" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="272" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">
      135° Physics Engine
    </text>

    <!-- Badge 3 -->
    <rect x="380" y="0" width="175" height="38" rx="10" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="467" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#2d6a4f" text-anchor="middle">
      WCAG AAA Contrast
    </text>

    <!-- Badge 4 -->
    <rect x="570" y="0" width="170" height="38" rx="10" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="655" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
      CLI &amp; npm Ready
    </text>

    <!-- Badge 5 -->
    <rect x="755" y="0" width="185" height="38" rx="10" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#insetPill)" />
    <text x="847" y="24" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="700" fill="#3d5a80" text-anchor="middle">
      By Ali Benkarrouch
    </text>
  </g>
</svg>
