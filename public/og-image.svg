<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#f0f3f8" />
      <stop offset="100%" stop-color="#d8dde6" />
    </radialGradient>

    <!-- 135-deg Raised Neumorphic Shadow Filter -->
    <filter id="raisedCard" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="12" dy="12" stdDeviation="16" flood-color="#a3b1c6" flood-opacity="0.6" />
      <feDropShadow dx="-12" dy="-12" stdDeviation="16" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>

    <!-- Subtle Inset Well Filter -->
    <filter id="insetWell" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#b8b9be" flood-opacity="0.5" />
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.8" />
    </filter>

    <linearGradient id="primaryPill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Background Subtle Grid Pattern -->
  <g opacity="0.06">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2b2e42" stroke-width="1"/>
    </pattern>
    <rect width="1200" height="630" fill="url(#grid)" />
  </g>

  <!-- Main Extruded Container Card -->
  <rect x="80" y="70" width="1040" height="490" rx="32" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#d1d9e6" stroke-width="1.5" />

  <!-- Logo Mark + Branding -->
  <g transform="translate(140, 130)">
    <!-- Tactile Cube Icon -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1" />
    <path d="M 20 24 L 32 16 L 44 24 L 44 40 L 32 48 L 20 40 Z" fill="none" stroke="#4f46e5" stroke-width="3" stroke-linejoin="round" />
    <path d="M 32 16 L 32 48" stroke="#4f46e5" stroke-width="2.5" />
    <path d="M 20 24 L 44 40" stroke="#4f46e5" stroke-width="2.5" />

    <!-- Brand Name -->
    <text x="80" y="38" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="28" font-weight="900" fill="#2b2e42" letter-spacing="-0.5">
      Neumorphia <tspan fill="#4f46e5">DevKit</tspan>
    </text>
    <text x="80" y="58" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="700" fill="#6c757d" letter-spacing="1">
      135° LIGHTING PHYSICS • ACCESSIBLE SOFT UI
    </text>
  </g>

  <!-- Hero Headline -->
  <text x="140" y="270" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="46" font-weight="900" fill="#2b2e42" letter-spacing="-1">
    Modern Neumorphic UI Components
  </text>
  <text x="140" y="325" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="34" font-weight="700" fill="#4f46e5">
    for Tailwind CSS &amp; React
  </text>

  <!-- Subtitle Description -->
  <text x="140" y="385" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="20" font-weight="500" fill="#4a5568">
    28+ Production-grade, tactile components with Dark Mode, WCAG AAA contrast,
  </text>
  <text x="140" y="415" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="20" font-weight="500" fill="#4a5568">
    interactive sandbox generator, and copy-paste TypeScript code.
  </text>

  <!-- Feature Pills / Badges in Inset Wells -->
  <g transform="translate(140, 465)">
    <!-- Pill 1: 28+ Components -->
    <rect x="0" y="0" width="170" height="42" rx="21" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#raisedCard)" />
    <text x="85" y="26" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="800" fill="#2b2e42" text-anchor="middle">
      ✨ 28+ Components
    </text>

    <!-- Pill 2: 135° Physics -->
    <rect x="190" y="0" width="180" height="42" rx="21" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#raisedCard)" />
    <text x="280" y="26" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="800" fill="#4f46e5" text-anchor="middle">
      📐 135° Directional Light
    </text>

    <!-- Pill 3: Dark Mode Ready -->
    <rect x="390" y="0" width="170" height="42" rx="21" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#raisedCard)" />
    <text x="475" y="26" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="800" fill="#2d6a4f" text-anchor="middle">
      🌙 Dark Mode Ready
    </text>

    <!-- Pill 4: Author Credit -->
    <rect x="580" y="0" width="220" height="42" rx="21" fill="#e6e7ee" stroke="#d1d9e6" stroke-width="1" filter="url(#raisedCard)" />
    <text x="690" y="26" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="800" fill="#3d5a80" text-anchor="middle">
      👤 By Ali Benkarrouch
    </text>
  </g>

  <!-- Interactive Demo Mock on the Right Side -->
  <g transform="translate(850, 160)">
    <!-- Raised Outer Control Box -->
    <rect x="0" y="0" width="210" height="260" rx="24" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Tactile Toggle Switch Inside -->
    <rect x="35" y="40" width="140" height="54" rx="27" fill="#d8dde6" filter="url(#insetWell)" stroke="#c2cbd8" stroke-width="1" />
    <circle cx="138" cy="67" r="22" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="138" cy="67" r="6" fill="#4f46e5" />

    <!-- Raised Tactile Action Button -->
    <rect x="35" y="130" width="140" height="50" rx="14" fill="#e6e7ee" filter="url(#raisedCard)" stroke="#ffffff" stroke-width="1" />
    <text x="105" y="161" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="14" font-weight="800" fill="#4f46e5" text-anchor="middle">
      Push Key
    </text>

    <!-- Status Indicator -->
    <circle cx="55" cy="215" r="5" fill="#10b981" />
    <text x="70" y="219" font-family="system-ui, -apple-system, 'Nunito', sans-serif" font-size="12" font-weight="700" fill="#6b7280">
      Online • 135° Light
    </text>
  </g>
</svg>
